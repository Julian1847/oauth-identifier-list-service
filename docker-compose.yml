version: "3.9"
services:
  postgres:
    image: postgres:15
    container_name: identifier_service_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: identifier_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql2/data

volumes:
  postgres_data:
