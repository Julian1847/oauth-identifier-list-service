app:
  public-url: http://localhost:8085
  storage-directory: identifier-lists
  issuer: https://example.com
  list-size: 10

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/identifier_service
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: never
  liquibase:
    enabled: false

server:
  port: 8085
logging:
  level:
    org.springframework: INFO

