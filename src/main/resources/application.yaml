server:
  port: 8085
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 1024  # Compress responses larger than 1KB

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/identifier_service
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
  liquibase:
    enabled: false

app:
  public-url: http://localhost:8085
  list-size: 100000
  api-key: 366A9069-2965-4667-9AD2-5C51D71046D9

logging:
  level:
    org.springframework: INFO
